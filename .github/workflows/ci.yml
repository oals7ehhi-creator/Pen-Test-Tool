name: ci

on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege default token.
permissions:
  contents: read

# All third-party actions are pinned to a full commit SHA (with the human-readable tag in a trailing comment)
# and all container images are pinned by digest — a supply-chain gate against tag/branch mutation.
jobs:
  # Phase 0 design-consistency gate: the specification's machine-checkable checker must pass.
  phase0-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Phase 0 consistency check
        run: python3 docs/phase-0/consistency/check_phase0_docs.py

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: pentest
          POSTGRES_PASSWORD: pentest_dev_only
          POSTGRES_DB: pentest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pentest -d pentest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pentest:pentest_dev_only@127.0.0.1:5432/pentest_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      # Reproducible install: fail if the lockfile is not in sync (supply-chain gate).
      - run: pnpm install --frozen-lockfile
      # `verify` builds every package to dist first, so typecheck/test/migrate run against real build output.
      - name: Build
        run: pnpm run build
      - name: Format check
        run: pnpm run format:check
      - name: Lint (incl. no-shell rule)
        run: pnpm run lint
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests + coverage
        run: pnpm -r run test
      - name: DB migrations up/down/up round-trip on a clean database
        run: pnpm --filter @pentest/db run migrate:ci

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Secret scanning: blocks merges on any committed secret.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Dependency vulnerability audit (supply-chain gate): fail on known high+ severity advisories.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      # SAST: static analysis for security anti-patterns. `if: always()` so it still runs even if an earlier
      # security step (gitleaks / audit) failed — we never want a secret or a vuln to mask a code-level finding.
      - name: SAST (semgrep)
        if: always()
        run: |
          python3 -m pip install --quiet semgrep==1.170.1
          semgrep scan --config p/typescript --error --metrics=off \
            --exclude=dist --exclude=coverage --exclude=node_modules .

  # Full-stack container gate: build every image and prove the whole stack (db + api + worker + web) comes up
  # HEALTHY. `--wait` blocks until each service's health check passes (or fails the job on timeout). This is the
  # executable evidence for the docker-compose bootstrap; images/actions here are pinned like everywhere else.
  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build images
        run: docker compose build
      - name: Boot the full stack and wait for every service to be healthy
        run: docker compose up -d --wait --wait-timeout 240
      - name: Show final service state
        if: always()
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
