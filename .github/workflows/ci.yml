name: ci

on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege default token.
permissions:
  contents: read

jobs:
  # Phase 0 design-consistency gate: the specification's machine-checkable checker must pass.
  phase0-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Phase 0 consistency check
        run: python3 docs/phase-0/consistency/check_phase0_docs.py

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pentest
          POSTGRES_PASSWORD: pentest_dev_only
          POSTGRES_DB: pentest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pentest -d pentest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pentest:pentest_dev_only@127.0.0.1:5432/pentest_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      # Reproducible install: fail if the lockfile is not in sync (supply-chain gate).
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Lint (incl. no-shell rule)
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests + coverage
        run: pnpm run test
      - name: DB migrations up/down on a clean database
        run: pnpm --filter @pentest/db run migrate:ci

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Secret scanning: blocks merges on any committed secret.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Dependency vulnerability audit (supply-chain gate): fail on known-vulnerable packages.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      # SAST: static analysis for security anti-patterns.
      - name: SAST (semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript
