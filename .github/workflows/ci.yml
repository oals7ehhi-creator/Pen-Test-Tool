name: ci

on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege default token. `pull-requests: read` lets the secret scanner enumerate a PR's commits on
# pull_request events (gitleaks-action requires the token to scan PRs); nothing here is granted write.
permissions:
  contents: read
  pull-requests: read

# Supply-chain gate: every third-party action is pinned to a full commit SHA (tag in a trailing comment) and every
# container image is pinned by digest. All actions are on Node 24 runtimes (no Node 20 deprecation warnings).
jobs:
  # Phase 0 design-consistency gate: the specification's machine-checkable checker must pass.
  phase0-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Phase 0 consistency check
        run: python3 docs/phase-0/consistency/check_phase0_docs.py

  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: pentest
          POSTGRES_PASSWORD: pentest_dev_only
          POSTGRES_DB: pentest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pentest -d pentest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pentest:pentest_dev_only@127.0.0.1:5432/pentest_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      # Reproducible install: fail if the lockfile is not in sync (supply-chain gate).
      - run: pnpm install --frozen-lockfile
      # `build` compiles every package to dist first, so typecheck/test/migrate run against real build output.
      - name: Build
        run: pnpm run build
      - name: Format check
        run: pnpm run format:check
      - name: Lint (incl. no-shell rule)
        run: pnpm run lint
      # Negative proof (hard gate, self-cleaning): a runtime-seeded file importing node:child_process MUST fail the
      # no-shell lint rule. Proves the gate has teeth; it never weakens the real lint above.
      - name: No-shell lint gate — negative proof
        run: bash ci/lint-noshell-negative-test.sh
      - name: Typecheck
        run: pnpm -r run typecheck
      # DATABASE_URL is set (Postgres service), so the db suite's real up/down snapshot tests run here too.
      # `test` runs vitest with --coverage in @pentest/shared and @pentest/api; both enforce explicit coverage
      # thresholds over their safety-critical source (auth, sessions, key resolution, RBAC, logging) with no broad
      # exclusions — a coverage regression fails this step.
      - name: Unit tests + coverage (thresholds enforced)
        run: pnpm -r run test
      # Reproducible-build proof (hard gate, self-cleaning): two independent clean frozen-lockfile installs must
      # materialize identical normalized dependency trees. Runs against an isolated copy — never mutates the tree.
      - name: Reproducible install — two frozen installs produce identical trees
        run: bash ci/deterministic-install-test.sh
      - name: DB migrations up/down/up round-trip on a clean database
        run: pnpm --filter @pentest/db run migrate:ci

  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Secret scanning: blocks merges on any committed secret. On pull_request events gitleaks-action REQUIRES
      # GITHUB_TOKEN (it enumerates the PR's commits via the API); on push it does not. Providing the
      # auto-created token makes the gate work identically on both event types.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Dependency vulnerability audit (supply-chain gate): fail on known high+ severity advisories.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
      # Negative proof (hard gate, self-cleaning): the SAME audit command must FAIL on a throwaway project pinned to
      # a known-critical advisory (minimist <0.2.4). The vulnerable dependency is never added to this repository.
      # This step depends on the pnpm/node setup above, so it runs in normal sequence (NOT `if: always()`) — it is
      # still a hard gate (no continue-on-error); forcing it to run after an earlier setup failure would only make
      # it fail spuriously on a missing pnpm rather than surface the real failure.
      - name: Dependency audit gate — negative proof
        run: bash ci/dependency-audit-negative-test.sh
      # SAST via a DIGEST-PINNED Semgrep container running this repo's OWN, reviewed ruleset (ci/semgrep-rules.yml).
      # No mutable remote pack and no version drift; `--metrics=off --disable-version-check` keep it hermetic. It
      # runs with `if: always()` so a failing gitleaks/audit step never skips the SAST scan.
      - name: SAST (semgrep, digest-pinned + repository-owned ruleset)
        if: always()
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941
          semgrep scan --error --metrics=off --disable-version-check
          --config /src/ci/semgrep-rules.yml
          --exclude node_modules --exclude dist --exclude coverage /src
      # Adversarial proof that .gitleaks.toml's allowlist is TIGHT: each permitted fixture is suppressed ONLY in its
      # authorized path and by its exact value; a real secret anywhere else — including on the same line as a
      # permitted fixture — is still detected. Runs the SAME pinned gitleaks version as the secret-scan gate (8.24.3),
      # extracted from a digest-pinned container. `if: always()` so this security test is never skipped; it is a hard
      # gate (the script exits non-zero on any mismatch and is not continue-on-error).
      - name: Adversarial gitleaks allowlist test (pinned gitleaks 8.24.3)
        if: always()
        run: |
          cid="$(docker create ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055)"
          docker cp "$cid:/usr/bin/gitleaks" "$RUNNER_TEMP/gitleaks"
          docker rm "$cid" >/dev/null
          chmod +x "$RUNNER_TEMP/gitleaks"
          GITLEAKS="$RUNNER_TEMP/gitleaks" GITLEAKS_CONFIG="$PWD/.gitleaks.toml" bash ci/gitleaks-allowlist-test.sh

  # Full-stack container gate: build every image and prove the whole stack (db + api + worker + web) comes up
  # HEALTHY. `--wait` blocks until each service's health check passes (or fails the job on timeout).
  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build images
        run: docker compose build
      - name: Boot the full stack and wait for every service to be healthy
        run: docker compose up -d --wait --wait-timeout 240
      - name: Show final service state
        if: always()
        run: docker compose ps
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
